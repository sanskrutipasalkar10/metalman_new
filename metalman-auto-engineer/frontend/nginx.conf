server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded/generated files can be large (STL/xlsx) - Excel outputs with
    # embedded images especially.
    client_max_body_size 200M;

    # FastAPI backend, reached over the Docker Compose network.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /outputs/ {
        proxy_pass http://backend:8000/outputs/;
        proxy_set_header Host $host;
    }

    location /stitch-demo/ {
        proxy_pass http://backend:8000/stitch-demo/;
        proxy_set_header Host $host;
    }

    # React Router SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
